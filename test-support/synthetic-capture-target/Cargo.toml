[package]
name = "synthetic-capture-target"
version = "0.1.0"
edition = "2024"
publish = false
description = "Windows-only behavioral-test helper process for membridge; never a public command."

# A separate workspace package (not a `[[bin]]` inside the `membridge`
# package) so `dist` never ships it as a release artifact: dist enumerates
# per-package, and this package opts itself out below.
[package.metadata.dist]
dist = false

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_System_Memory",
] }
