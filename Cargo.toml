[package]
name = "membridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Deterministic, bounded process-memory inspection for humans and AI agents"
repository = "https://github.com/sharkone/membridge"

[dependencies]
aho-corasick = "1.1.3"
blake3 = "1.8.2"
clap = { version = "4.5.48", features = ["derive"] }
hex = "0.4.3"
memmap2 = "0.9.8"
minidump = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"

[dev-dependencies]
assert_cmd = "2.0.17"
minidump-synth = "0.27.0"
tempfile = "3.23.0"
test-assembler = "0.1.5"
