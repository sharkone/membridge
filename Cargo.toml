[package]
name = "membridge"
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.87"
description = "Deterministic, bounded process-memory inspection for humans and AI agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sharkone/membridge"
default-run = "membridge"

[dependencies]
aho-corasick = "1.1.3"
blake3 = "1.8.2"
clap = { version = "4.5.48", features = ["derive"] }
hex = "0.4.3"
memmap2 = "0.9.8"
minidump = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[dev-dependencies]
assert_cmd = "2.0.17"
minidump-synth = "0.27.0"
tempfile = "3.23.0"
test-assembler = "0.1.5"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
